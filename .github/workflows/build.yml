name: "Build and push"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  INFRA_REPO: https://github.com/feelingover/sphene-infra.git

on:
  push:
    branches: ['main']

jobs:
  build:
    name: "Build and push"
    runs-on: ubuntu-latest

    permissions:
        contents: read
        packages: write
        attestations: write
        id-token: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=build-${{ github.run_number }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          platforms: linux/arm64,linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          
      - name: Extract image tag
        id: extract-tag
        run: |
          echo "IMAGE_TAG=build-${{ github.run_number }}" >> $GITHUB_OUTPUT
          
      - name: Get last commit message
        id: last-commit
        run: |
          echo "message<<EOF" >> $GITHUB_OUTPUT
          git log -1 --pretty=%B >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 🤖 AI generated PR title (Gemini API)
      - name: Generate PR title with AI
        id: ai-title
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          COMMIT_MSG: ${{ steps.last-commit.outputs.message }}
          IMAGE_TAG: ${{ steps.extract-tag.outputs.IMAGE_TAG }}
        run: |
          echo "🤖 AIにPRタイトルを考えてもらっています..."
          PROMPT="このリポジトリはgitops用インフラリポジトリ。デプロイPRタイトルを作って。
          コミットメッセージ: ${COMMIT_MSG}
          イメージタグ: ${IMAGE_TAG}
          はてなブックマークでバズりそうな面白いタイトルを1行で。絵文字も使って。タイトルだけを出力すること。"
          FALLBACK="🚀新イメージのデプロイリクエスト ${IMAGE_TAG}"

          AI_TITLE=$(.github/scripts/gemini_generate.sh "$PROMPT" "$FALLBACK" | sed '/^[[:space:]]*$/d' | head -1)
          echo "Generated title: $AI_TITLE"
          {
            echo "title<<EOF_TITLE"
            echo "$AI_TITLE"
            echo "EOF_TITLE"
          } >> "$GITHUB_OUTPUT"

      # 🤖 AI generated PR body (Gemini API)
      - name: Generate PR body with AI
        id: ai-body
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          COMMIT_MSG: ${{ steps.last-commit.outputs.message }}
          IMAGE_TAG: ${{ steps.extract-tag.outputs.IMAGE_TAG }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "🤖 AIにPR説明文を考えてもらっています..."
          PROMPT="このリポジトリはgitopsのインフラリポジトリ。デプロイPRの説明文をマークダウンで作ってください。明るく楽しい、くだけた雰囲気で。

          コミット内容: ${COMMIT_MSG}
          イメージタグ: ${IMAGE_TAG}
          ビルドURL: ${BUILD_URL}

          以下の情報を含めてね:
          - 🏷️ イメージタグ
          - 📝 変更内容
          - 🔨 ビルドリンク
          - マージボタンを押してもらうお願い

          出力はマークダウンの本文だけを出力すること。"
          FALLBACK="### 新しいイメージがきたよ！

          🚀 マージしたら本番環境にデプロイされます！

          #### 📝 更新内容
          - ${COMMIT_MSG}
          - 🏷️ イメージタグ: \`${IMAGE_TAG}\`
          - 🔨 ビルド: ${BUILD_URL}

          問題なさそうだったらマージボタン押しちゃって〜！"

          AI_BODY=$(.github/scripts/gemini_generate.sh "$PROMPT" "$FALLBACK")
          echo "Generated body:"
          echo "$AI_BODY"
          {
            echo "body<<EOF_BODY"
            echo "$AI_BODY"
            echo "EOF_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: feelingover/sphene-infra
          path: infra
          token: ${{ secrets.PAT_TOKEN }}
          
      - name: Update sphene.yaml with new image tag
        run: |
          cd infra
          IMAGE_TAG=${{ steps.extract-tag.outputs.IMAGE_TAG }}
          DEPLOYMENT_FILE="discord-bot/sphene/app.yaml"

          # Replace the image tag in sphene.yaml
          sed -i -e "s|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}|g" $DEPLOYMENT_FILE
          

      - name: Create Pull Request with AI-generated content
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.PAT_TOKEN }}
          path: infra
          commit-message: Update image to ${{ steps.extract-tag.outputs.IMAGE_TAG }}
          branch: update-image-${{ steps.extract-tag.outputs.IMAGE_TAG }}
          title: ${{ steps.ai-title.outputs.title }}
          body: ${{ steps.ai-body.outputs.body }}
